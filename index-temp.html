<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Pin Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: white;
        }

        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
        }

        .section-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .section-3 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        /* The pinned section */
        .pin-section {
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: #1a1a1a;
        }

        .pin-wrap {
            display: flex;
            height: 100vh;
        }

        .pin-panel {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
        }

        .panel-1 {
            background: linear-gradient(135deg, #ffa500 0%, #ff6347 100%);
        }

        .panel-2 {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }

        .panel-3 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .panel-4 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        /* Animated elements example */
        .animate-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2d2d2d;
            position: relative;
            overflow: hidden;
        }

        .animated-box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            position: absolute;
        }

        .box-1 { top: 10%; left: 10%; }
        .box-2 { top: 10%; right: 10%; }
        .box-3 { bottom: 10%; left: 10%; }
        .box-4 { bottom: 10%; right: 10%; }

        .center-text {
            font-size: 3rem;
            font-weight: bold;
            z-index: 10;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="section section-1">
        <div>Scroll Down â†“</div>
    </div>

    <!-- Horizontal scroll pinning section -->
    <div class="pin-section">
        <div class="pin-wrap">
            <div class="pin-panel panel-1">Panel 1</div>
            <div class="pin-panel panel-2">Panel 2</div>
            <div class="pin-panel panel-3">Panel 3</div>
            <div class="pin-panel panel-4">Panel 4</div>
        </div>
    </div>

    <!-- Animated elements section -->
    <div class="animate-section">
        <div class="animated-box box-1"></div>
        <div class="animated-box box-2"></div>
        <div class="animated-box box-3"></div>
        <div class="animated-box box-4"></div>
        <div class="center-text">Elements Moving!</div>
    </div>

    <div class="section section-3">
        <div>The End ðŸŽ‰</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Horizontal scroll pinning effect
        let panels = gsap.utils.toArray(".pin-panel");
        gsap.to(panels, {
            xPercent: -100 * (panels.length - 1),
            ease: "none",
            scrollTrigger: {
                trigger: ".pin-section",
                pin: true,
                scrub: 1,
                snap: 1 / (panels.length - 1),
                end: () => "+=" + document.querySelector(".pin-wrap").offsetWidth
            }
        });

        // Animated boxes effect
        gsap.to(".box-1", {
            x: 300,
            y: 300,
            rotation: 360,
            scrollTrigger: {
                trigger: ".animate-section",
                pin: true,
                scrub: 1,
                start: "top top",
                end: "+=100%"
            }
        });

        gsap.to(".box-2", {
            x: -300,
            y: 300,
            rotation: -360,
            scrollTrigger: {
                trigger: ".animate-section",
                scrub: 1,
                start: "top top",
                end: "+=100%"
            }
        });

        gsap.to(".box-3", {
            x: 300,
            y: -300,
            rotation: 360,
            scrollTrigger: {
                trigger: ".animate-section",
                scrub: 1,
                start: "top top",
                end: "+=100%"
            }
        });

        gsap.to(".box-4", {
            x: -300,
            y: -300,
            rotation: -360,
            scrollTrigger: {
                trigger: ".animate-section",
                scrub: 1,
                start: "top top",
                end: "+=100%"
            }
        });

        gsap.to(".center-text", {
            scale: 2,
            opacity: 0,
            scrollTrigger: {
                trigger: ".animate-section",
                scrub: 1,
                start: "top top",
                end: "+=100%"
            }
        });
    </script>
</body>
</html>
